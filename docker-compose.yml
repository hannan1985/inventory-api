services:
  postgres:
    image: postgres:17            # official Postgres image, version 17
    environment:
      POSTGRES_USER: inventory    # must match the user in your .env
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"               # your machine's port : the container's port
    volumes:
      - pgdata:/var/lib/postgresql/data   # keep data when the container restarts

  mosquitto:
    image: eclipse-mosquitto:2    # MQTT broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:                         # declares the named volume used above
